name: Update WordPress.org Assets and Readme

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['readme.txt', '.github/workflows/update-assets.yml']

permissions:
  contents: read

concurrency:
  group: alpdt-wordpress-org-svn
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'ALPDT readme refresh 1.0.27')
    name: Sync readme and gallery (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Publish readme and assets only
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: alp-dynamic-time-countdowns
          ASSETS_DIR: .wordpress-org
          IGNORE_OTHER_FILES: 'true'
